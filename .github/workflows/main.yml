name: RDP

on:
  workflow_dispatch:
  # Allows the workflow to re-trigger itself automatically
  repository_dispatch:
    types: [loop_rdp]

jobs:
  secure-rdp:
    # Explicitly targets the Windows Server 2025 environment
    runs-on: windows-2025
    # Lower this to 350 minutes so GitHub doesn't throw an infrastructure error
    timeout-minutes: 350 

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://tailscale.com"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          
          # Force refresh system path registry blocks so binary execution targets work instantly
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: Establish Tailscale Connection
        run: |
          # Start background Windows system daemon explicitly and let it catch breath
          Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue | Start-Service
          Start-Sleep -Seconds 15
          
          $tsExe = "${env:ProgramFiles}\Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
              Start-Sleep -Seconds 5
              $tsIP = & $tsExe ip -4
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection and Auto-Loop
        # The GITHUB_TOKEN environment variable allows the runner to call back the API securely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # 20,400 seconds equals exactly 5 hours and 40 minutes
          $maxRuntimeSeconds = 20400
          $elapsedSeconds = 0
          $interval = 300 # check loop every 5 minutes
          while ($elapsedSeconds -lt $maxRuntimeSeconds) {
              Write-Host "[$(Get-Date)] RDP Active - Runtime: ($elapsedSeconds / $maxRuntimeSeconds) seconds"
              Start-Sleep -Seconds $interval
              $elapsedSeconds += $interval
          }
          Write-Host "5 Hours 40 Minutes reached. Spawning a new environment loop before shutdown..."
          
          # Headers and payload required for GitHub Repository Dispatch API
          $headers = @{
              "Authorization" = "token $env:GITHUB_TOKEN"
              "Accept"        = "application/vnd.github.v3+json"
          }
          $body = @{
              "event_type" = "loop_rdp"
          } | ConvertTo-Json
          
          # Target corrected api.github.com repository dispatch engine endpoint
          Invoke-RestMethod -Uri "https://github.com{env:GITHUB_REPOSITORY}/dispatches" `
                            -Method Post `
                            -Headers $headers `
                            -Body $body
                            
          Write-Host "Successfully scheduled next loop execution. Exiting gracefully."
